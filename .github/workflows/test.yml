name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x, latest]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        services:
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            REDIS_STANDALONE_URL: redis://localhost:6379/11
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            # Node 22+ loads ES modules through require() by default, which would hide an ESM-only
            # dependency. Load the built CommonJS entry with that turned off, as the pkg binary
            # EmailEngine ships would load it.
            - run: npm run test:cjs
              if: matrix.node != '20.x'

    cluster:
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x, latest]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            # Three masters with one replica each in one container on 127.0.0.1:7100-7105
            - run: scripts/redis-cluster.sh up
            - run: npm run test:cluster
            - name: Redis Cluster logs
              if: failure()
              run: docker logs ioredfour-cluster

    # Both suites under c8, which enforces the thresholds in .c8rc.json
    coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            REDIS_STANDALONE_URL: redis://localhost:6379/11
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - run: scripts/redis-cluster.sh up
            - run: npm run test:coverage

    # Bundles the packed package into a @yao-pkg/pkg binary, the way EmailEngine ships it, and
    # runs a lock round trip from the binary
    pkg:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            REDIS_STANDALONE_URL: redis://localhost:6379/11
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - run: npm run test:pkg
